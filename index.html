<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente 3D com Three.js</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .painel {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
      z-index: 10;
    }

    h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    button:active { transform: scale(0.97); }

    .btn-avancar  { background-color: #0284c7; color: white; }
    .btn-sucesso  { background-color: #16a34a; color: white; }
    .btn-alerta   { background-color: #d97706; color: white; }
    .btn-erro     { background-color: #dc2626; color: white; }

    #assistente-container {
      position: fixed;
      bottom: 0px;
      right: 15px;
      width: 280px;
      height: 440px;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
    }

    #balao-fala {
      pointer-events: auto;
      background: #ffffff;
      color: #0f172a;
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 240px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      margin-bottom: 6px;
      margin-right: 25px;
      position: relative;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #balao-fala::after {
      content: '';
      position: absolute;
      bottom: -7px;
      right: 60px;
      border-width: 7px 7px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    #canvas-3d {
      width: 100% !important;
      height: 360px !important;
      pointer-events: auto;
      cursor: grab;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="painel">
    <h1>Painel de Demonstração</h1>
    <p>Mova o rato pelo ecrã para ver o seu modelo 3D virar e acompanhar os seus movimentos em tempo real:</p>
    
    <div class="btn-grid">
      <button class="btn-avancar" id="btn-avancar">Avançar Etapa</button>
      <button class="btn-sucesso" id="btn-sucesso">Concluir Tarefa</button>
      <button class="btn-alerta"  id="btn-alerta">Item Pendente</button>
      <button class="btn-erro"    id="btn-erro">Simular Erro</button>
    </div>
  </div>

  <div id="assistente-container">
    <div id="balao-fala">A carregar modelo 3D...</div>
    <canvas id="canvas-3d"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const balao = document.getElementById('balao-fala');
    const canvas = document.getElementById('canvas-3d');

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(42, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 1.25, 2.3);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const luzAmbiente = new THREE.AmbientLight(0xffffff, 1.6);
    scene.add(luzAmbiente);

    const luzFrontal = new THREE.DirectionalLight(0xffffff, 2.0);
    luzFrontal.position.set(2, 3, 3);
    scene.add(luzFrontal);

    const luzPreenchimento = new THREE.DirectionalLight(0x38bdf8, 1.2);
    luzPreenchimento.position.set(-2, 1, 2);
    scene.add(luzPreenchimento);

    let avatarModel = null;
    const targetRotation = { x: 0, y: 0 };

    const loader = new GLTFLoader();
    loader.load(
      'mascote.glb',
      (gltf) => {
        avatarModel = gltf.scene;
        avatarModel.position.set(0, 0, 0);
        scene.add(avatarModel);
        balao.innerText = 'Olá! Estou online em 3D. Mova o rato para interagir!';
      },
      undefined,
      (err) => {
        balao.innerText = 'Certifique-se de que o ficheiro mascote.glb está na raiz do GitHub.';
      }
    );

    window.addEventListener('mousemove', (e) => {
      const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;

      targetRotation.y = mouseX * 0.45;
      targetRotation.x = -mouseY * 0.2;
    });

    function falar(texto) {
      balao.innerText = texto;
      if (avatarModel) {
        avatarModel.scale.set(1.08, 1.08, 1.08);
        setTimeout(() => {
          if (avatarModel) avatarModel.scale.set(1, 1, 1);
        }, 250);
      }
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      if (avatarModel) {
        avatarModel.position.y = Math.sin(elapsed * 2.4) * 0.025;
        avatarModel.rotation.y = THREE.MathUtils.lerp(avatarModel.rotation.y, targetRotation.y, 0.08);
        avatarModel.rotation.x = THREE.MathUtils.lerp(avatarModel.rotation.x, targetRotation.x, 0.08);
      }

      renderer.render(scene, camera);
    }

    animate();

    document.getElementById('btn-avancar').addEventListener('click', () => {
      falar('Boa! Dados validados, vamos para o próximo passo.');
    });

    document.getElementById('btn-sucesso').addEventListener('click', () => {
      falar('Sensacional! Processo finalizado com 100% de sucesso!');
    });

    document.getElementById('btn-alerta').addEventListener('click', () => {
      falar('Atenção: verifique se não ficou nenhum dado pendente.');
    });

    document.getElementById('btn-erro').addEventListener('click', () => {
      falar('Ops! Foi detetada uma falha nessa ação.');
    });

    let timerOcioso;
    function reiniciarOcioso() {
      clearTimeout(timerOcioso);
      timerOcioso = setTimeout(() => {
        falar('Ainda por aí? Se precisar de ajuda, estou por aqui! 👍');
      }, 8000);
    }
    window.addEventListener('mousemove', reiniciarOcioso);
    reiniciarOcioso();
  </script>

</body>
</html>
