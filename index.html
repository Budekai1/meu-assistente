<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Interativo Web</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Painel demonstrativo da aplicação */
    .painel {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-avancar  { background-color: #0284c7; color: #ffffff; }
    .btn-sucesso  { background-color: #16a34a; color: #ffffff; }
    .btn-alerta   { background-color: #d97706; color: #ffffff; }
    .btn-erro     { background-color: #dc2626; color: #ffffff; }

    /* ========================================================= */
    /* COMPONENTE DO ASSISTENTE NO CANTO DO ECRÃ                 */
    /* ========================================================= */
    #assistente-container {
      position: fixed;
      bottom: 10px;
      right: 25px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 9999;
      pointer-events: none;
    }

    /* Balão de Diálogo */
    #balao-fala {
      pointer-events: auto;
      background: #ffffff;
      color: #0f172a;
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 220px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      margin-bottom: 6px;
      position: relative;
      transition: transform 0.2s ease;
    }

    /* Ponteiro do balão a apontar para o assistente */
    #balao-fala::after {
      content: '';
      position: absolute;
      bottom: -7px;
      right: 50px;
      border-width: 7px 7px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    /* Imagem do Mascote com Respiração / Flutuação Contínua */
    #mascote-img {
      pointer-events: auto;
      width: 140px;
      height: auto;
      object-fit: contain;
      cursor: pointer;
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.45));
      animation: flutuar 3.4s infinite ease-in-out;
      transform-origin: bottom center;
    }

    /* Movimento autónomo contínuo */
    @keyframes flutuar {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    /* Salto ao interagir ou falar */
    .salto {
      animation: animar-salto 0.35s ease !important;
    }

    @keyframes animar-salto {
      0%   { transform: scale(1) translateY(0); }
      50%  { transform: scale(1.06) translateY(-12px); }
      100% { transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Painel de Testes -->
  <div class="painel">
    <h1>Painel de Demonstração</h1>
    <p>Clique nos botões abaixo ou aguarde 7 segundos sem interagir para vê-lo a comunicar sozinho:</p>
    
    <div class="btn-grid">
      <button class="btn-avancar" id="btn-avancar">Avançar Etapa</button>
      <button class="btn-sucesso" id="btn-sucesso">Concluir Tarefa</button>
      <button class="btn-alerta"  id="btn-alerta">Item Pendente</button>
      <button class="btn-erro"    id="btn-erro">Simular Erro</button>
    </div>
  </div>

  <!-- Estrutura do Assistente -->
  <div id="assistente-container">
    <div id="balao-fala">Olá! Estou pronto para o acompanhar.</div>
    <img id="mascote-img" src="mascote.png" alt="Assistente Virtual">
  </div>

  <script>
    const balao   = document.getElementById('balao-fala');
    const mascote = document.getElementById('mascote-img');

    let timerInatividade;
    const frasesOcioso = [
      "Ainda por aí? Se precisar de ajuda, basta carregar!",
      "Tudo sob controlo por aqui! 👍",
      "Pronto para prosseguir para a próxima fase?",
      "Dúvidas no processo? Escolha uma das opções no ecrã."
    ];

    // Atualiza o texto e despoleta o efeito visual
    function falar(texto) {
      balao.innerText = texto;

      mascote.classList.remove('salto');
      void mascote.offsetWidth; // Força o recálculo imediato do browser
      mascote.classList.add('salto');

      reiniciarInatividade();
    }

    // Comunica automaticamente após 7 segundos de inatividade
    function reiniciarInatividade() {
      clearTimeout(timerInatividade);
      timerInatividade = setTimeout(() => {
        const frase = frasesOcioso[Math.floor(Math.random() * frasesOcioso.length)];
        falar(frase);
      }, 7000);
    }

    reiniciarInatividade();

    // Eventos dos botões do ecrã
    document.getElementById('btn-avancar').addEventListener('click', () => {
      falar('Excelente! Dados validados, podemos continuar.');
    });

    document.getElementById('btn-sucesso').addEventListener('click', () => {
      falar('Fantástico! Processo finalizado com 100% de sucesso!');
    });

    document.getElementById('btn-alerta').addEventListener('click', () => {
      falar('Atenção: confirme se todos os campos foram preenchidos.');
    });

    document.getElementById('btn-erro').addEventListener('click', () => {
      falar('Ops! Foi detetada uma inconsistência nesta ação.');
    });

    // Clique direto no mascote
    mascote.addEventListener('click', () => {
      falar('Tudo operacional! Pode prosseguir no sistema.');
    });
  </script>

</body>
</html>
